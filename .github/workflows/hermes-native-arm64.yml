name: Fork ARM64 validation - pyopengl
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-c4963bc3ddb6
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fork-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  loader-regression:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python:
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: c4963bc3ddb600b917ce31ef7d7a1a38ff71f3ca
    - name: Verify exact public PR source revision
      shell: pwsh
      run: '$actual = git rev-parse HEAD

        if ($actual -ne ''c4963bc3ddb600b917ce31ef7d7a1a38ff71f3ca'') { throw ''Source revision mismatch'' }

        Write-Output (''TESTED_SOURCE_SHA=''+$actual)'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}
        architecture: arm64
    - name: Install source and test prerequisites
      run: 'python -m pip install setuptools wheel pytest pytest-subtests numpy

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        python -m pip install --no-deps -e .'
    - name: Native interpreter and loader regressions, no GPU claim
      run: 'python -c "import sysconfig; assert sysconfig.get_platform() == ''win-arm64''; print(sysconfig.get_platform())"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        python -m pytest tests/bindings/glut/test_glut_library_names.py tests/bindings/glut/test_windows_interpreter_architecture.py tests/bindings/platform/test_library_loading.py tests/bindings/platform/test_plugin_load_failure.py -q -rs --junitxml=loader-tests.xml'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: loader-tests-${{ matrix.python }}
        path: loader-tests.xml
        if-no-files-found: error
    permissions:
      contents: read
    timeout-minutes: 60
    if: github.repository_owner == 'johnnynunez'
